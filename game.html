<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worldroot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="hud">
      <a href="index.html" class="hud-brand">Worldroot</a>
      <div class="hud-stats">
        <span class="hud-stat" title="Account Total Level">
          <span class="hud-stat-label">Acct</span>
          <strong id="account-level">0</strong>
        </span>
        <span class="hud-stat" title="Gold">
          <span class="hud-stat-label">Gold</span>
          <strong id="gold-total">0</strong>
        </span>
      </div>
    </header>

    <nav class="tab-bar" id="tab-bar">
      <button type="button" class="tab-btn active" disabled>Loading…</button>
    </nav>

    <main class="tab-content">
      <section id="panel-characters" class="tab-panel" data-tab="characters">
        <p class="panel-intro">Loading game…</p>
      </section>
      <section id="panel-skills" class="tab-panel hidden" data-tab="skills"></section>
      <section id="panel-resources" class="tab-panel hidden" data-tab="resources"></section>
      <section id="panel-worldroot" class="tab-panel hidden" data-tab="worldroot"></section>
      <section id="panel-settings" class="tab-panel hidden" data-tab="settings"></section>
    </main>
  </div>

  <div id="class-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h2 id="class-modal-title">Choose a class</h2>
      <div id="class-options" class="class-options"></div>
    </div>
  </div>

  <script src="js/config.js?v=4"></script>
  <script src="js/state.js?v=4"></script>
  <script src="js/engine.js?v=4"></script>
  <script src="js/ui.js?v=4"></script>
  <script type="module" src="js/gameBootstrap.js?v=4"></script>
</body>
</html>
