<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Grow the World Tree. Command your party in this browser idle RPG." />
  <meta name="theme-color" content="#1a281a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Worldroot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png" />
  <title>Worldroot</title>
  <link rel="stylesheet" href="css/style.css?v=77" />
</head>
<body>
  <div id="rotate-device-overlay" class="rotate-device-overlay" aria-live="polite">
    <div class="rotate-device-card">
      <span class="rotate-device-icon" aria-hidden="true">📱↻</span>
      <h2>Rotate your device</h2>
      <p>Worldroot plays in landscape on phones. Turn your device sideways to continue.</p>
    </div>
  </div>

  <div class="app-shell">
    <header class="top-bar">
      <a href="index.html" class="top-bar-brand">
        <img src="assets/worldroot-logo.png" alt="Worldroot" class="brand-logo" />
      </a>
      <div class="top-bar-stats">
        <div class="stat-chip" title="Account Total Level">
          <span class="stat-chip-icon">⭐</span>
          <span class="stat-chip-label">Level</span>
          <strong id="account-level">0</strong>
        </div>
        <div class="stat-chip" title="Gold">
          <span class="stat-chip-icon">🪙</span>
          <span class="stat-chip-label">Gold</span>
          <strong id="gold-total">0</strong>
        </div>
        <div class="stat-chip stat-chip-muted" title="Notifications">
          <span class="stat-chip-icon">🔔</span>
          <span class="stat-chip-label">Alerts</span>
          <strong id="notification-count">0</strong>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content" id="main-content">
        <div class="page-body-split">
          <section id="panel-main" class="content-panel">
            <p class="panel-intro">Loading…</p>
          </section>
          <aside id="panel-detail" class="detail-panel" aria-label="Details"></aside>
        </div>
      </main>
    </div>
  </div>

  <div id="class-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h2 id="class-modal-title">Choose a class</h2>
      <div id="class-options" class="class-options"></div>
    </div>
  </div>

  <div id="upgrade-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-upgrade-modal"></div>
    <div class="modal-card upgrade-modal-card">
      <div id="upgrade-modal-content"></div>
    </div>
  </div>

  <div id="transfer-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-transfer-modal"></div>
    <div class="modal-card transfer-modal-card">
      <h2>Transfer amount</h2>
      <p id="transfer-modal-label" class="empty-msg"></p>
      <label class="transfer-modal-field">
        <span>Amount</span>
        <input id="transfer-amount-input" type="number" min="1" value="1" />
      </label>
      <div class="transfer-modal-actions">
        <button type="button" class="btn-sm primary" data-action="confirm-transfer">Transfer</button>
        <button type="button" class="btn-sm ghost" data-action="close-transfer-modal">Cancel</button>
      </div>
    </div>
  </div>

  <div id="offline-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-offline-modal"></div>
    <div class="modal-card offline-modal-card">
      <h2>Welcome back!</h2>
      <div id="offline-modal-content" class="offline-modal-content"></div>
      <div class="transfer-modal-actions">
        <button type="button" class="btn-sm primary" data-action="close-offline-modal">Continue</button>
      </div>
    </div>
  </div>

  <div id="trash-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-trash-modal"></div>
    <div class="modal-card transfer-modal-card">
      <h2>Delete item?</h2>
      <p id="trash-modal-label" class="empty-msg"></p>
      <div class="transfer-modal-actions">
        <button type="button" class="btn-sm primary" data-action="confirm-trash">Delete</button>
        <button type="button" class="btn-sm ghost" data-action="close-trash-modal">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=77"></script>
  <script src="js/items.js?v=77"></script>
  <script src="js/gear.js?v=77"></script>
  <script src="js/state.js?v=77"></script>
  <script src="js/engine.js?v=77"></script>
  <script src="js/ui.js?v=77"></script>
  <script type="module" src="js/gameBootstrap.js?v=77"></script>
</body>
</html>
