<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worldroot</title>
  <link rel="stylesheet" href="css/style.css?v=39" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <a href="index.html" class="top-bar-brand">
        <span class="brand-icon">🌳</span>
        <span class="brand-name">Worldroot</span>
      </a>
      <div class="top-bar-stats">
        <div class="stat-chip" title="Account Total Level">
          <span class="stat-chip-icon">⭐</span>
          <span class="stat-chip-label">Level</span>
          <strong id="account-level">0</strong>
        </div>
        <div class="stat-chip" title="Gold">
          <span class="stat-chip-icon">🪙</span>
          <span class="stat-chip-label">Gold</span>
          <strong id="gold-total">0</strong>
        </div>
        <div class="stat-chip stat-chip-muted" title="Notifications">
          <span class="stat-chip-icon">🔔</span>
          <span class="stat-chip-label">Alerts</span>
          <strong id="notification-count">0</strong>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content" id="main-content">
        <section id="panel-main" class="content-panel">
          <p class="panel-intro">Loading…</p>
        </section>
      </main>
    </div>
  </div>

  <div id="class-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <h2 id="class-modal-title">Choose a class</h2>
      <div id="class-options" class="class-options"></div>
    </div>
  </div>

  <div id="upgrade-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-upgrade-modal"></div>
    <div class="modal-card upgrade-modal-card">
      <div id="upgrade-modal-content"></div>
    </div>
  </div>

  <div id="transfer-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="close-transfer-modal"></div>
    <div class="modal-card transfer-modal-card">
      <h2>Transfer amount</h2>
      <p id="transfer-modal-label" class="empty-msg"></p>
      <label class="transfer-modal-field">
        <span>Amount</span>
        <input id="transfer-amount-input" type="number" min="1" value="1" />
      </label>
      <div class="transfer-modal-actions">
        <button type="button" class="btn-sm primary" data-action="confirm-transfer">Transfer</button>
        <button type="button" class="btn-sm ghost" data-action="close-transfer-modal">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=39"></script>
  <script src="js/items.js?v=39"></script>
  <script src="js/gear.js?v=39"></script>
  <script src="js/state.js?v=39"></script>
  <script src="js/engine.js?v=39"></script>
  <script src="js/ui.js?v=39"></script>
  <script>
    if (!window.__worldrootBooted) {
      var panel = document.getElementById('panel-main');
      if (panel) {
        panel.innerHTML = '<p class="empty-msg" style="color:#e8a0a0">Game failed to start. Go to <a href="index.html">home page</a>, click Play offline, then try again.</p>';
      }
    }
  </script>
  <script type="module" src="js/gameBootstrap.js?v=39"></script>
</body>
</html>
